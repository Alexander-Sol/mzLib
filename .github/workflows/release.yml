name: Release

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set up NuGet
        uses: nuget/setup-nuget@v1
        with:
          nuget-version: '6.x'
      - name: Verify commit exists in origin/master
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/${env:RELEASE_BRANCH}
        env:
          RELEASE_BRANCH: master
      - name: Restore dependencies
        run: |
          cd mzLib
          dotnet restore
      # Build the packaged assemblies as Any CPU rather than x64. An x64 PlatformTarget stamps AMD64 into
      # the PE header, and an arm64 .NET runtime then refuses the assembly with
      # "FileLoadException: Could not load file or assembly '<name>'". Any CPU assemblies still run 64-bit
      # on a 64-bit runtime, so x64 consumers are unaffected. Output moves from bin/x64/Release to
      # bin/Release, which is where mzLib.nuspec now looks.
      - name: Build
        run: |
          $version= &git describe --tags
          cd mzLib
          dotnet build --no-restore --configuration Release /p:Platform="Any CPU" /p:Version=${version}
      - name: Test
        run: |
          $version= &git describe --tags
          cd mzLib
          dotnet test --configuration Release /p:Platform="Any CPU" /p:Version=${version} --no-build
      # Two packages ship from this tag and must stay in lockstep: mzLib, and mzLib.Chronologer,
      # which carries the TorchSharp/libtorch payload as an opt-in extra. mzLib.Chronologer pins an
      # EXACT dependency on mzLib, so mzLib must be pushed first and the Chronologer push must not
      # run if it failed.
      #
      # These are four separate steps rather than one run: block on purpose. In a single block a
      # step's exit code is the exit code of its LAST command, $ErrorActionPreference does not abort
      # on a native executable's failure, and before the split the mzLib push happened to be last -
      # so its failure failed the step. It no longer would. The failure mode that buys is permanent:
      # the mzLib push fails, the Chronologer push succeeds, the job reports green, and nuget.org
      # holds an mzLib.Chronologer pinned to [version] of an mzLib that was never published.
      # NuGet.org versions are immutable, so that package can never be made restorable.
      - name: Pack mzLib
        run: |
          $version= &git describe --tags
          cd mzLib
          nuget pack mzLib.nuspec -Version ${version} -Properties Configuration=Release
      - name: Pack mzLib.Chronologer
        run: |
          $version= &git describe --tags
          cd mzLib
          nuget pack mzLib.Chronologer.nuspec -Version ${version} -Properties "Configuration=Release;mzlibversion=${version}"
      - name: Push mzLib
        run: |
          $version= &git describe --tags
          cd mzLib
          dotnet nuget push mzLib.${version}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${env:GITHUB_TOKEN}
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_KEY }}
      # Reached only if the mzLib push above succeeded, which is the whole point of the split.
      - name: Push mzLib.Chronologer
        run: |
          $version= &git describe --tags
          cd mzLib
          dotnet nuget push mzLib.Chronologer.${version}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${env:GITHUB_TOKEN}
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_KEY }}
